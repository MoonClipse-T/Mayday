<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MAYDAY</title>
<meta name="theme-color" content="#040506">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
<script>
// 고칠 때마다 V 를 올린다 → 디벗 브라우저가 옛 파일을 쓰지 않는다 (화면 디자인 · 맵 .glb 도 같은 번호로 받는다)
window.V=/[?&]dev/.test(location.search)?String(Date.now()):'15';
document.write('<link rel="stylesheet" href="web/style.css?v='+V+'">');
</script>
</head>
<body class="at-title">
<canvas id="c"></canvas>

<!-- 바이저 : 가장자리 계기선 · 위치 · 시각 -->
<div id="visor" aria-hidden="true">
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  <p id="stamp"><span class="rec"></span><span id="where">—</span><span id="when"></span></p>
</div>

<!-- HUD -->
<div id="hud">
  <div id="goal"><span class="k">목표</span><span id="goaltext"></span></div>
  <div id="reticle"><i></i><i></i><i></i><i></i></div>
  <p id="label"></p>
  <div id="stick"><div id="knob"></div></div>
  <button id="act" class="ring" aria-label="조사 · 대화">조사</button>
  <button id="run" class="ring small" aria-label="달리기">달리기</button>
  <button id="jump" class="ring small" aria-label="점프">점프</button>
  <p id="toast"></p>
</div>

<!-- 교신 자막 -->
<div id="talk" aria-live="polite">
  <p class="who"><span class="ch"></span><b class="name"></b></p>
  <p class="txt"></p>
  <span class="more" aria-hidden="true"></span>
</div>

<!-- 장 카드 (영화 자막) -->
<div id="card"><i class="bar top"></i><i class="bar bot"></i>
  <div class="in"><p class="kick"></p><p class="title"></p><p class="sub"></p></div></div>

<!-- 문서 (승무원 태블릿) -->
<div id="doc" class="ov"><div class="slate"><p class="head"><span class="dt"></span><span class="id">NASA · JSC</span></p>
  <h2></h2><div class="body"></div><button class="close">닫기</button></div></div>

<!-- 동면 캡슐 단말 (해동 · 생체 신호) -->
<div id="vitals" aria-live="polite">
  <p class="hd"><span class="id">C-00</span><span class="st">해동 중</span></p>
  <p class="nm"></p><p class="rl"></p>
  <div class="row"><span class="k">체온</span><b class="temp">31.2</b><span class="u">℃</span></div>
  <div class="row"><span class="k">심박</span><b class="hr">12</b><span class="u">bpm</span></div>
  <div class="bar"><i></i></div>
</div>

<!-- 선내도 (지금 있는 곳) -->
<div id="shipmap" aria-hidden="true"></div>

<!-- 함교 홀로그램 조작 -->
<div id="holoui"><p class="hd">AR 항법 홀로그램 · 끌어서 돌리기 · 두 손가락(휠)으로 확대</p><div class="btns"></div><button class="close">닫기</button></div>

<div id="fade" class="on"></div>
<!-- 불러오는 중 (검은 화면 위 진행 줄) -->
<div id="loading" aria-live="polite"><p class="lb">선내 시스템 동기화</p><div class="bar"><i></i></div></div>

<!-- 시작 화면 -->
<div id="title">
  <p class="org">NASA · 하위헌스 계획 · 기밀 2급</p>
  <h1>MAYDAY</h1>
  <p class="log">수신 기록 HUY-1 / 312일째 — <span>“Mayday, Mayday, we are—”</span></p>
  <button id="start" disabled>불러오는 중</button>
  <p class="how"></p>
  <p class="credit">공간 · 인물 : Sketchfab CC BY (README 참고) · 별지도 NASA/Goddard SVS · 목성 지도 Solar System Scope CC BY 4.0 · 밤 풍경 Poly Haven CC0</p>
</div>

<script>
['vendor/three.r128.min.js','vendor/GLTFLoader.js','vendor/meshopt_decoder.js','vendor/SkeletonUtils.js','engine.js','people.js','sky.js','screens.js','holo.js',
 'scenes/s0_meeting.js','scenes/s0b_launch.js','scenes/s0c_orbit.js','scenes/ship.js','scenes/s1_cryo.js','scenes/s2_deck.js','scenes/s2b_lounge.js','scenes/s3_bridge.js','scenes/s4_rooms.js','main.js']
 .reduce((p,f)=>p.then(()=>new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='web/'+f+'?v='+V; s.onload=res; s.onerror=()=>rej(new Error(f)); document.body.appendChild(s); })),Promise.resolve())
 .catch(e=>{ document.getElementById('start').textContent='불러오기 실패 — '+e.message; });
</script>
</body>
</html>
